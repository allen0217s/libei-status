# 男主状态变量预设 v2
名称: 默认预设
字段:
  - id: scene-location
    path: [世界, 当前场景发生地]
    label: 当前场景发生地
    group: 场景
    type: string
    default: "城中村七平米带隔断单间"
    enabled: true
    visible: true
    updateMode: ai
    rule: "根据角色移动或所处场景的明确转换进行更新。"

  - id: world-date
    path: [世界, 日期]
    label: 日期
    group: 场景
    type: string
